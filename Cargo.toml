[package]
name = "cashu-pixel"
version = "0.1.0"
edition = "2021"

[dependencies]
cdk = { version = "0.18", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "0.18", default-features = false, features = ["wallet"] }
slint = { version = "1.6", features = ["backend-linuxkms", "renderer-software"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
qrcode = { version = "0.14", default-features = false }
nostr-sdk = { version = "0.44.1", default-features = false, features = ["nip44", "nip59"] }
serde_json = "1"
rand = "0.8"
dirs = "5"
# --snapshot: writes screens to PNG
png = "0.17"
# BLE receive: a GATT server through BlueZ. libdbus is compiled in (vendored), so the
# build image needs no extra packages; the Pi has the system bus and bluetoothd.
bluer = { version = "0.17", features = ["bluetoothd"] }
dbus = { version = "0.9", features = ["vendored"] }

[build-dependencies]
slint-build = "1.6"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
